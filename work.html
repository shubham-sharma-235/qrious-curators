<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --black:#000;
  --white:#fff;
  --orange:#F5A623;
  --orange-2:#E8521E;
  --gray:rgba(255,255,255,0.55);
  --faint:rgba(255,255,255,0.28);
  --card-radius:22px;
}

body{
  background:var(--black);
  color:var(--white);
  font-family:'Raleway',sans-serif;
  overflow-x:hidden;
}
body.locked{overflow:hidden;}

/* ── OUR WORK TITLE ── */
.work-head{
  padding:120px 40px 50px;
  max-width:1700px;
  margin:0 auto;
}
.work-head h1{
  font-size:clamp(56px,11vw,160px);
  font-weight:700;
  letter-spacing:-3px;
  line-height:0.9;
  background:linear-gradient(120deg,#fff 40%,#ffd9b0 65%,#ffc98a 85%,#fff 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.work-head .work-sub{
  display:block;
  margin-top:24px;
  font-size:15px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--gray);
  font-weight:600;
}

/* ── PROJECT GRID ── */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:24px;
  padding:0 40px 100px;
  max-width:1700px;
  margin:0 auto;
}

.card{
  position:relative;
  border-radius:var(--card-radius);
  overflow:hidden;
  aspect-ratio:16/10;
  cursor:pointer;
  background:#111;
}

.card-media{
  position:absolute;
  top:-12%;left:0;
  width:100%;height:124%;
  will-change:transform;
}
.card-media img,.card-media video{
  width:100%;height:100%;
  object-fit:cover;
  transition:transform 0.7s cubic-bezier(0.4,0,0.2,1);
}
.card:hover .card-media img,
.card:hover .card-media video{
  transform:scale(1.05);
}

.card::after{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,0.75) 0%,rgba(0,0,0,0.1) 45%,transparent 70%);
  z-index:1;
  pointer-events:none;
}

/* tags row (top-left) like Lusion */
.card-tags{
  position:absolute;
  top:22px;left:24px;
  z-index:3;
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:rgba(255,255,255,0.85);
  font-weight:600;
}
.card-tags span{opacity:0.7;}

/* project name bottom-left */
.card-title{
  position:absolute;
  bottom:26px;left:30px;
  z-index:3;
  font-size:clamp(26px,2.6vw,40px);
  font-weight:600;
  letter-spacing:-0.5px;
  color:var(--white);
  max-width:80%;
  line-height:1.05;
}

/* arrow on hover */
.card-arrow{
  position:absolute;
  bottom:30px;right:30px;
  z-index:3;
  width:46px;height:46px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,0.3);
  display:flex;align-items:center;justify-content:center;
  opacity:0;
  transform:translateX(-8px);
  transition:all 0.4s cubic-bezier(0.4,0,0.2,1);
}
.card:hover .card-arrow{opacity:1;transform:translateX(0);}
.card-arrow svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.5;}

/* ── FULL-SCREEN PROJECT DETAIL (Lusion-style) ── */
.overlay{
  position:fixed;
  inset:0;
  z-index:1000;
  background:var(--black);
  overflow-y:auto;
  overflow-x:hidden;
  opacity:0;
  visibility:hidden;
  transition:opacity 0.45s ease, visibility 0.45s;
}
.overlay.open{ opacity:1; visibility:visible; }

/* zoom-in feel: content scales up from slightly small */
#overlayContent{
  transform:scale(0.94);
  opacity:0;
  transition:transform 0.7s cubic-bezier(0.22,1,0.36,1), opacity 0.6s ease;
}
.overlay.open #overlayContent{
  transform:scale(1);
  opacity:1;
}

.overlay-close{
  position:fixed;
  top:30px;right:40px;
  z-index:1010;
  width:54px;height:54px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,0.25);
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(10px);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.3s;
}
.overlay-close:hover{background:var(--white);}
.overlay-close:hover svg{stroke:var(--black);}
.overlay-close svg{width:22px;height:22px;stroke:#fff;stroke-width:1.5;}

/* TOP: split layout — left text, right big image */
.ov-top{
  display:grid;
  grid-template-columns:1fr 1.15fr;
  gap:60px;
  align-items:center;
  min-height:100vh;
  padding:120px 60px 80px;
  max-width:1700px;
  margin:0 auto;
}
.ov-left{ max-width:560px; }
.ov-title{
  font-size:clamp(48px,6vw,92px);
  font-weight:700;
  letter-spacing:-2px;
  line-height:0.95;
  margin-bottom:36px;
  color:var(--white);
}
.ov-desc{
  font-size:clamp(15px,1.2vw,17px);
  line-height:1.7;
  color:var(--gray);
  margin-bottom:20px;
  max-width:460px;
}
.ov-desc:last-of-type{ margin-bottom:0; }

.ov-cols{
  display:flex;
  gap:80px;
  margin-top:48px;
}
.ov-col h4{
  font-size:12px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--orange);margin-bottom:16px;font-weight:600;
}
.ov-col ul{ list-style:none; }
.ov-col li{
  font-size:15px;color:var(--white);margin-bottom:8px;font-weight:400;
}
.ov-col li a{ color:var(--white); text-decoration:none; opacity:0.8; transition:opacity 0.2s; }
.ov-col li a:hover{ opacity:1; }

.ov-watch{
  display:inline-flex;align-items:center;gap:14px;
  margin-top:50px;
  font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:var(--black);
  background:var(--white);
  border-radius:100px;
  padding:18px 32px;
  text-decoration:none;
  transition:transform 0.3s, background 0.3s, color 0.3s;
}
.ov-watch .dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--orange-2);
}
.ov-watch:hover{ transform:translateY(-2px); }

.ov-right{
  position:relative;
}
.ov-mainimg{
  width:100%;
  aspect-ratio:4/3.4;
  object-fit:cover;
  border-radius:22px;
  display:block;
}

/* SCROLL GALLERY — images flow on the side as you scroll */
.ov-gallery{
  padding:40px 60px 120px;
  max-width:1700px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:60px;
}
.ov-shot{
  width:100%;
  border-radius:22px;
  overflow:hidden;
  opacity:0;
  transform:translateY(60px);
  transition:opacity 1s cubic-bezier(0.22,1,0.36,1), transform 1s cubic-bezier(0.22,1,0.36,1);
}
.ov-shot.in{ opacity:1; transform:translateY(0); }
.ov-shot img{
  width:100%;
  display:block;
  object-fit:cover;
}
/* alternate widths for an editorial side-flow feel */
.ov-shot.left{ align-self:flex-start; width:72%; }
.ov-shot.right{ align-self:flex-end; width:72%; }
.ov-shot.full{ width:100%; }

/* stats row inside detail */
.ov-stats{
  display:flex;flex-wrap:wrap;gap:50px;
  padding:0 60px 100px;
  max-width:1700px;margin:0 auto;
}
.ov-stat .num{
  font-size:clamp(40px,5vw,64px);font-weight:800;letter-spacing:-2px;line-height:1;
  background:linear-gradient(100deg,var(--orange),var(--orange-2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.ov-stat .cap{ margin-top:12px;font-size:13px;color:var(--gray); }

/* ── PAGINATION ── */
.pagination{
  display:flex;
  justify-content:center;
  gap:14px;
  padding:0 40px 80px;
}
.page-btn{
  width:46px;height:46px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,0.2);
  background:transparent;
  color:var(--white);
  font-family:'Raleway',sans-serif;
  font-size:15px;font-weight:600;
  cursor:pointer;
  transition:all 0.3s;
  display:flex;align-items:center;justify-content:center;
}
.page-btn:hover{border-color:var(--white);}
.page-btn.active{
  background:var(--white);
  color:var(--black);
  border-color:var(--white);
}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  .grid{grid-template-columns:1fr;}
  .work-head{padding:80px 22px 36px;}
  .grid{padding:0 22px 70px;}
  .ov-top{
    grid-template-columns:1fr;
    gap:40px;
    padding:90px 22px 50px;
    min-height:auto;
  }
  .ov-cols{gap:50px;flex-wrap:wrap;}
  .ov-gallery{padding:30px 22px 80px;gap:40px;}
  .ov-shot.left,.ov-shot.right{width:100%;}
  .ov-stats{padding:0 22px 70px;gap:30px;}
  .overlay-close{top:20px;right:22px;width:46px;height:46px;}
}

/* Lusion-style reveal: rise + scale + fade, staggered */
.reveal{
  opacity:0;
  transform:translateY(70px) scale(0.96);
  transition:opacity 1s cubic-bezier(0.22,1,0.36,1),
             transform 1s cubic-bezier(0.22,1,0.36,1);
}
.reveal.show{
  opacity:1;
  transform:translateY(0) scale(1);
}
</style>
</head>

          </div>
          ${linksHTML}
        </div>
        ${watchHTML}
      </div>
      <div class="ov-right">
        <img class="ov-mainimg" src="${p.img}" alt="${p.name}" onerror="this.style.opacity=0.2"/>
      </div>
    </div>
    ${statsHTML}
    <div class="ov-gallery">
      ${galleryHTML}
    </div>
  `;

  overlay.scrollTop = 0;
  overlay.classList.add('open');
  document.body.classList.add('locked');

  // reveal gallery shots on scroll within overlay
  const shotsEls = overlayContent.querySelectorAll('.ov-shot');
  const shotObs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); shotObs.unobserve(e.target); } });
  }, { root: overlay, threshold: 0.15 });
  shotsEls.forEach(s => shotObs.observe(s));
}

function closeProject(){
  overlay.classList.remove('open');
  document.body.classList.remove('locked');
}

overlayClose.addEventListener('click', closeProject);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeProject(); });

// ============ LUSION-STYLE SCROLL EFFECTS ============

// 1) Staggered reveal as cards enter viewport
const allCards = Array.from(document.querySelectorAll('.card'));
const obs = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if(e.isIntersecting){
      // stagger based on column position for a nicer wave
      const idx = allCards.indexOf(e.target);
      const delay = (idx % 2) * 90; // left/right slight offset
      setTimeout(() => e.target.classList.add('show'), delay);
      obs.unobserve(e.target);
    }
  });
}, { threshold: 0.18, rootMargin: '0px 0px -8% 0px' });
allCards.forEach(c => obs.observe(c));

// 2) Parallax: image drifts inside its card as you scroll (depth feel)
let ticking = false;
function parallaxScroll(){
  const vh = window.innerHeight;
  allCards.forEach(card => {
    const rect = card.getBoundingClientRect();
    // only animate cards in/near viewport
    if(rect.bottom < -200 || rect.top > vh + 200) return;
    const media = card.querySelector('.card-media');
    if(!media) return;
    // progress: -1 (card at bottom) -> 1 (card at top)
    const center = rect.top + rect.height/2;
    const progress = (center - vh/2) / (vh/2);  // ~ -1..1
    const shift = progress * -6; // percent, gentle
    media.style.transform = `translateY(${shift}%)`;
  });
  ticking = false;
}
window.addEventListener('scroll', () => {
  if(!ticking){
    requestAnimationFrame(parallaxScroll);
    ticking = true;
  }
}, { passive:true });
parallaxScroll();
</script>
