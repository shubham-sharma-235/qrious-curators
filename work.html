      // ============ BUILD GRID ============
      const grid = document.getElementById("grid");

      PROJECTS.forEach((p, i) => {
        const card = document.createElement("div");
        card.className = "card reveal";
        card.dataset.id = p.id;
        const tagsHTML = p.tags.map((t) => t).join(" • ");
        card.innerHTML = `
    <div class="card-media"><img src="${p.img}" alt="${p.name}" onerror="this.style.opacity=0.15"/></div>
    <div class="card-tags">${tagsHTML}</div>
    <h3 class="card-title">${p.name}</h3>
    <div class="card-arrow">
      <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12,5 19,12 12,19"/></svg>

  `;

        grid.appendChild(card);

      // ============ OVERLAY ============
      const overlay = document.getElementById("overlay");
      const overlayContent = document.getElementById("overlayContent");
      const overlayClose = document.getElementById("overlayClose");

      function openProject(p) {
        // services as a list
        const svcList = (p.services || "")
          .split(",")
          .map((s) => s.trim())
          .filter(Boolean);
        const svcHTML = svcList.map((s) => `<li>${s}</li>`).join("");

        // links list (built from url if present)
        const links = [];
        if (p.url && p.url !== "#")
          links.push(
            `<li><a href="${p.url}" target="_blank">Visit website</a></li>`,
          );
        const linksHTML = links.length
          ? `
    <div class="ov-col">
      <h4>Links</h4>
      <ul>${links.join("")}</ul>
    </div>`
          : "";

        // watch / visit button
        const watchHTML =
          p.url && p.url !== "#"
            ? `
    <a href="${p.url}" target="_blank" class="ov-watch"><span class="dot"></span> Visit Website</a>`
            : `
    <a href="#" class="ov-watch" onclick="return false"><span class="dot"></span> View Project</a>`;

        // scroll gallery — use available images, alternate sides for editorial flow
        const shots = p.gallery && p.gallery.length ? p.gallery : [p.img];
        const sideClasses = ["full", "left", "right", "full", "left"];
        const galleryHTML = shots
          .map(
            (g, i) =>
              `<div class="ov-shot ${sideClasses[i % sideClasses.length]}"><img src="${g}" alt="${p.name}" onerror="this.parentElement.style.display='none'"/></div>`,
          )
          .join("");

        const statsHTML =
          p.stats && p.stats.length
            ? `
    <div class="ov-stats">
      ${p.stats.map((s) => `<div class="ov-stat"><div class="num">${s.num}</div><div class="cap">${s.cap}</div></div>`).join("")}
    </div>`
            : "";

        overlayContent.innerHTML = `
    <div class="ov-top">
      <div class="ov-left">
        <h1 class="ov-title">${p.name}</h1>
        <p class="ov-desc">${p.intro.replace(/<\/?em>/g, "")}</p>
        <p class="ov-desc">${p.overview}</p>
        <div class="ov-cols">
          <div class="ov-col">
            <h4>Services</h4>
            <ul>${svcHTML}</ul>
          </div>
          ${linksHTML}
        </div>
        ${watchHTML}
      </div>
      <div class="ov-right">
        <img class="ov-mainimg" src="${p.img}" alt="${p.name}" onerror="this.style.opacity=0.2"/>
      </div>
    </div>
    ${statsHTML}
    <div class="ov-gallery">
      ${galleryHTML}
    </div>
  `;

        overlay.scrollTop = 0;
        overlay.classList.add("open");
        document.body.classList.add("locked");

        // reveal gallery shots on scroll within overlay
        const shotsEls = overlayContent.querySelectorAll(".ov-shot");
        const shotObs = new IntersectionObserver(
          (entries) => {
            entries.forEach((e) => {
              if (e.isIntersecting) {
                e.target.classList.add("in");
                shotObs.unobserve(e.target);
              }
            });
          },
          { root: overlay, threshold: 0.15 },
        );
        shotsEls.forEach((s) => shotObs.observe(s));
      }

      function closeProject() {
        overlay.classList.remove("open");
        document.body.classList.remove("locked");
      }

      overlayClose.addEventListener("click", closeProject);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeProject();
      });

      // ============ LUSION-STYLE SCROLL EFFECTS ============

      // 1) Staggered reveal as cards enter viewport
      const allCards = Array.from(document.querySelectorAll(".card"));
      const obs = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              // stagger based on column position for a nicer wave
              const idx = allCards.indexOf(e.target);
              const delay = (idx % 2) * 90; // left/right slight offset
              setTimeout(() => e.target.classList.add("show"), delay);
              obs.unobserve(e.target);
            }
          });
        },
        { threshold: 0.18, rootMargin: "0px 0px -8% 0px" },
      );
      allCards.forEach((c) => obs.observe(c));

      // 2) Parallax: image drifts inside its card as you scroll (depth feel)
      let ticking = false;
      function parallaxScroll() {
        const vh = window.innerHeight;
        allCards.forEach((card) => {
          const rect = card.getBoundingClientRect();
          // only animate cards in/near viewport
          if (rect.bottom < -200 || rect.top > vh + 200) return;
          const media = card.querySelector(".card-media");
          if (!media) return;
          // progress: -1 (card at bottom) -> 1 (card at top)
          const center = rect.top + rect.height / 2;
          const progress = (center - vh / 2) / (vh / 2); // ~ -1..1
          const shift = progress * -6; // percent, gentle
          media.style.transform = `translateY(${shift}%)`;
        });
        ticking = false;
      }
      window.addEventListener(
        "scroll",
        () => {
          if (!ticking) {
            requestAnimationFrame(parallaxScroll);
            ticking = true;
          }
        },
        { passive: true },
      );
      parallaxScroll();
